name: Build Android APK from ZIP

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p /tmp/app_build
          if [ -f gonurse.zip ]; then
            unzip -o gonurse.zip -d /tmp/app_build
          elif [ -f gonurse-source.zip ]; then
            unzip -o gonurse-source.zip -d /tmp/app_build
          fi

          NESTED_DIR=$(find /tmp/app_build -name "settings.gradle.kts" -exec dirname {} \; | head -1)
          if [ -n "$NESTED_DIR" ]; then
            cp -r "$NESTED_DIR"/. .
          else
            cp -r /tmp/app_build/. .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Google Services
        run: |
          mkdir -p app
          cat << 'GSEOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "606749018816",
              "project_id": "gonurse-2ac77",
              "storage_bucket": "gonurse-2ac77.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:606749018816:android:gonurse",
                  "android_client_info": {
                    "package_name": "com.aistudio.gonurse.medcare"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummy-ReplaceWithRealKey" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSEOF
          touch .env

      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Make gradlew executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version=9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -x test -x lint

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoNurse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
