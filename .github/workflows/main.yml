name: Build Android APK from ZIP

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File Safely
        run: |
          echo "=== 1. Checking repository files ==="
          ls -la
          
          mkdir -p /tmp/app_build
          
          find . -maxdepth 2 -type f -name "*.zip" -exec unzip -o "{}" -d /tmp/app_build \;
          
          echo "=== 2. locating project root ==="
          BUILD_DIR=$(find /tmp/app_build -name "build.gradle" -exec dirname {} \; | head -n 1)
          
          if [ -z "$BUILD_DIR" ]; then
            BUILD_DIR=$(find /tmp/app_build -name "settings.gradle" -exec dirname {} \; | head -n 1)
          fi
          
          if [ -n "$BUILD_DIR" ]; then
            echo "Project root found at: $BUILD_DIR"
            cp -r "$BUILD_DIR"/* .
            cp -r "$BUILD_DIR"/.* . 2>/dev/null || true
          else
            echo "Copying all from temp..."
            cp -r /tmp/app_build/* . 2>/dev/null || true
          fi
          
          echo "=== 3. Current Root Directory Content ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Google Services & Env files
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "606749018816",
              "project_id": "gonurse-2ac77",
              "storage_bucket": "gonurse-2ac77.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:606749018816:android:gonurse",
                  "android_client_info": {
                    "package_name": "com.aistudio.gonurse.medcare"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummy-ReplaceWithRealKey" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          
          # إنشاء ملفات الـ env المطلوبة لمنع خطأ الفقدان
          touch .env
          touch .env.example

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing, generating one..."
            gradle wrapper
            chmod +x ./gradlew
          else
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -x test -x lint

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoNurse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
