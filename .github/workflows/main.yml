name: Build Android APK from ZIP

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          # فك ضغط الملف
          if [ -f gonurse.zip ]; then
            unzip -o gonurse.zip -d extracted_app
          elif [ -f gonurse-source.zip ]; then
            unzip -o gonurse-source.zip -d extracted_app
          fi
          
          # نقل الملفات للجذر إن كانت داخل مجلد فرعي
          if [ -d extracted_app ]; then
            cp -r extracted_app/* . 2>/dev/null || true
            cp -r extracted_app/.* . 2>/dev/null || true
            # إذا وجد مجلد فرعي متداخل
            SUBDIR=$(find extracted_app -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/build.gradle.kts" ]; then
              cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoNurse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
