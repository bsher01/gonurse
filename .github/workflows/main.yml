name: Build Android APK from ZIP

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p /tmp/app_build
          if [ -f gonurse.zip ]; then
            unzip -o gonurse.zip -d /tmp/app_build
          elif [ -f gonurse-source.zip ]; then
            unzip -o gonurse-source.zip -d /tmp/app_build
          fi
          
          # إذا كانت الملفات داخل مجلد فرعي متداخل
          if [ ! -f /tmp/app_build/settings.gradle.kts ]; then
            NESTED_DIR=$(find /tmp/app_build -name "settings.gradle.kts" -exec dirname {} \;)
            if [ -n "$NESTED_DIR" ]; then
              cp -r "$NESTED_DIR"/* .
              cp -r "$NESTED_DIR"/.* . 2>/dev/null || true
            fi
          else
            cp -r /tmp/app_build/* .
            cp -r /tmp/app_build/.* . 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoNurse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
